# Developer tools for this repository, installed with `mise install`.
# Keep every pin on its latest release (docs/dependencies.md, "Tools via
# mise"). `rust` must equal the channel in rust-toolchain.toml, which is what
# CI installs (an xtask unit test checks the pins agree).
[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.31.1"
# Required by velnor-actions 0.1.69 workflow validation.
jactionlint = "2.3.0"
gh = "2.103.3"
# The release named in .velnor/release-manifest.json (docs/ci.md).
"github:tailrocks/velnor-new" = { version = "0.1.69", bin = "velnor-actions" }
# tuiscotti's CLI at the same rev as the tuiscotti-latest dev-dependency.
"cargo:https://github.com/tailrocks/tuiscotti" = { version = "rev:d8d54155947f6303a41dfd6079b53c0abc16f29a", crate = "tuiscotti-cli" }
# mr-boxington (mbx) 1.29.0 (latest): shared Cargo build cache. The
# postinstall runs the documented standalone `mbx setup` on install, which
# links mbx as the cargo wrapper for local builds. CI uses Velnor's cargo
# compile driver: its mbx driver requires host-seeded tool caches that
# GitHub-hosted runners do not provide (docs/functional-testing.md).
mr-boxington = { version = "1.29.0", postinstall = "mbx setup --yes" }
# Last on purpose: mise puts each tool's bin directory on PATH in this
# order, and rust's is ~/.cargo/bin, where an older `cargo install`ed
# cargo-nextest, velnor-actions or tuiscotti would otherwise win.
rust = { version = "1.99.1", components = "clippy,rustfmt" }
