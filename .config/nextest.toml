# cargo-nextest config. Process-per-test isolation is the default and is
# required for PTY captures (libtest --test-threads shares one process).
#
# Default: `cargo nextest run`
# Visual baseline: `cargo nextest run --run-ignored only -E 'binary(visual_baseline)'`
#   (groups pending tuiscotti re-approval also need `VISUAL_FULL=1`)
# Approve reviewed actuals (local only):
#   `VISUAL_ACCEPT=<prefix> cargo nextest run --run-ignored only --ignore-default-filter -E 'test(=accept_actuals)'`

[test-groups]
# Real TUI binaries in PTYs; cap concurrency so boot does not starve.
pty = { max-threads = 8 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s" }
# Approval writes snapshots/; it never runs as part of a gate.
default-filter = "not test(=accept_actuals)"

[[profile.default.overrides]]
filter = "binary(visual_baseline)"
test-group = "pty"
# Audit matrices run 25 PTYs in one test; 4×60s killed them under load.
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = '''
  test(scrolling)
  or test(tablepro_audit)
  or test(holla_audit)
  or test(jackin_audit)
  or test(showcase_audit)
  or test(terminal_default)
  or test(docker_done)
'''
threads-required = 2

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
