# cargo-nextest config. Process-per-test isolation is the default and is
# required for PTY captures (libtest --test-threads shares one process).
#
# The only test target is `functional` (tests/functional): real binaries in
# PTYs driven by tui_test, each ending with a frozen Tuiscotti check.
#   cargo nextest run --locked --test functional --profile functional

[test-groups]
# Real TUI binaries in PTYs; cap concurrency so boot does not starve.
pty = { max-threads = 8 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s" }

[[profile.default.overrides]]
filter = "binary(functional)"
test-group = "pty"
threads-required = 2
slow-timeout = { period = "30s", terminate-after = 3 }

[profile.functional]
default-filter = 'binary(functional)'
fail-fast = false

[profile.functional.junit]
path = "functional.xml"

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
