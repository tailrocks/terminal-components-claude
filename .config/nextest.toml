[test-groups]

pty = { max-threads = 8 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s" }

[[profile.default.overrides]]
filter = "binary(functional)"
test-group = "pty"
threads-required = 2
slow-timeout = { period = "30s", terminate-after = 3 }

[profile.functional]
default-filter = 'binary(functional)'
fail-fast = false

[profile.functional.junit]
path = "functional.xml"

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
