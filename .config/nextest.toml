# cargo-nextest config. Process-per-test isolation is the default and is
# required for PTY captures (libtest --test-threads shares one process).
#
# Default: `cargo nextest run`
# Visual baseline lives in tests/harness/ (own crate + lockfile); run it there:
#   cd tests/harness
#   cargo nextest run --run-ignored only -E 'binary(visual_baseline)'
#   cargo nextest run --run-ignored only --ignore-default-filter -E 'test(rebuild_review_html)'

[test-groups]
# Real TUI binaries in PTYs; cap concurrency so boot does not starve.
pty = { max-threads = 8 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s" }
# The HTML report re-verifies every actual; it is a publish step, not the
# capture gate.
default-filter = "not test(rebuild_review_html)"

[[profile.default.overrides]]
filter = '''
  test(scrolling)
  or test(terminal_default)
  or test(docker_done)
'''
threads-required = 2

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
