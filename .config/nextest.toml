# cargo-nextest config. Process-per-test isolation is the default and is
# required for PTY captures (libtest --test-threads shares one process).
#
# Default: `cargo nextest run`
# Visual baseline (one test per scenario, named
# `<app>::<group>::<leaf>…::<cols>x<rows>::<color>`):
#   `cargo nextest run --run-ignored only -E 'binary(visual_baseline)'`
#   (groups pending tuiscotti re-approval also need `VISUAL_FULL=1`)
# Approve reviewed actuals (local only):
#   `VISUAL_ACCEPT=<prefix> cargo nextest run --run-ignored only --ignore-default-filter -E 'test(=accept_actuals)'`

[test-groups]
# Real TUI binaries in PTYs; cap concurrency so boot does not starve.
pty = { max-threads = 8 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s" }
# Approval writes snapshots/; it never runs as part of a gate.
default-filter = "not test(=accept_actuals)"

[[profile.default.overrides]]
filter = "binary(visual_baseline)"
test-group = "pty"
# One capture per test: boot, steps (timeouts up to 60 s for the streaming
# terminal page) and, on a mismatch, the review PNG/HTML render.
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
# Boot-streaming screens: give them a second slot so they do not starve.
filter = '''
  binary(visual_baseline) & (
    test(/::scrolling::/)
    or test(/^showcase::pages::terminal::/)
    or test(/^holla::flows::docker::done::/)
  )
'''
threads-required = 2

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
