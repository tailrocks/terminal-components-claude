[package]
name = "junie-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Junie-inspired Ratatui design-system laboratory"
license = "MIT"

default-run = "showcase"

# `cargo xtask …` (alias in .cargo/config.toml): repository tasks.
[workspace]
members = [".", "xtask"]

[lib]
name = "junie_tui"
path = "src/lib.rs"
# Doctests need `cargo test --doc`, which this repo never runs (nextest
# only). Examples in docs are mirrored by functional tests instead.
doctest = false

[[bin]]
name = "showcase"
path = "src/bin/showcase/main.rs"

[[bin]]
name = "tablepro"
path = "src/bin/tablepro/main.rs"

[[bin]]
name = "jackin-preview"
path = "src/bin/jackin/main.rs"

[[bin]]
name = "holla"
path = "src/bin/holla/main.rs"

[[test]]
name = "functional"
path = "tests/functional/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
# terminal input checks crossterm 0.29 lacks (runtime `tty_input`)
libc = "0.2"

[dev-dependencies]
# Live driver: tuiscotti-tui-test 0.2.1 (crate tui_test), the live half of
# latest Tuiscotti — checked mouse/keyboard input, native PTY launch.
tui-test = { package = "tuiscotti-tui-test", version = "=0.2.1" }
# Latest tuiscotti main (0.4.0, offline frozen-check layer) for the
# FrozenStore visual gate in tests/functional.
tuiscotti-latest = { package = "tuiscotti", git = "https://github.com/tailrocks/tuiscotti", rev = "d8d54155947f6303a41dfd6079b53c0abc16f29a" }
serde_json = "1"

# Optimize dependencies in dev and test builds (tuiscotti's recommendation):
# the review PNG/HTML rendered for a visual mismatch drops from seconds to
# tens of milliseconds. Our own crates stay unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
