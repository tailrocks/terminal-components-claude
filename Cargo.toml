[package]
name = "junie-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Junie-inspired Ratatui design-system laboratory"
license = "MIT"

default-run = "showcase"

# `cargo xtask …` (alias in .cargo/config.toml): repository tasks such as
# `cargo xtask visual accept` (docs/visual-testing/README.md).
[workspace]
members = [".", "xtask"]

[lib]
name = "junie_tui"
path = "src/lib.rs"
# Doctests need `cargo test --doc`, which this repo never runs (nextest
# only). Examples in docs are mirrored by unit tests instead.
doctest = false

[[bin]]
name = "showcase"
path = "src/bin/showcase/main.rs"

[[bin]]
name = "tablepro"
path = "src/bin/tablepro/main.rs"

[[bin]]
name = "jackin-preview"
path = "src/bin/jackin_preview/main.rs"

[[bin]]
name = "holla"
path = "src/bin/holla/main.rs"

# Visual suite (docs/visual-testing): one test per scenario, generated from
# the scenario tables by a libtest-mimic main instead of `#[test]` fns.
[[test]]
name = "visual_baseline"
path = "tests/visual_baseline/main.rs"
harness = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
libtest-mimic = "0.8.2"
# Oracle manifest `harness_sha256` (tests/visual_baseline/oracle.rs); the
# same version tuiscotti already pulls in.
sha2 = "0.11"
tuiscotti = { git = "https://github.com/tailrocks/tuiscotti", rev = "a47c9aaefb34e4c00026f99d8a8dd7ee5916b274" }

[profile.release]
lto = "thin"
codegen-units = 1
