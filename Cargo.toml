[package]
name = "junie-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Junie-inspired Ratatui design-system laboratory"
license = "MIT"

default-run = "showcase"

# `cargo xtask …` (alias in .cargo/config.toml): repository tasks such as
# `cargo xtask visual check-touched` (docs/visual-testing/README.md).
[workspace]
members = [".", "xtask"]

[lib]
name = "junie_tui"
path = "src/lib.rs"
# Doctests need `cargo test --doc`, which this repo never runs (nextest
# only). Examples in docs are mirrored by unit tests instead.
doctest = false

[[bin]]
name = "showcase"
path = "src/bin/showcase/main.rs"

[[bin]]
name = "tablepro"
path = "src/bin/tablepro/main.rs"

[[bin]]
name = "jackin-preview"
path = "src/bin/jackin_preview/main.rs"

[[bin]]
name = "holla"
path = "src/bin/holla/main.rs"

# Visual suite (docs/visual-testing): one test per scenario, generated from
# the scenario tables by a libtest-mimic main instead of `#[test]` fns.
[[test]]
name = "visual_baseline"
path = "tests/visual_baseline/main.rs"
harness = false

[[test]]
name = "functional"
path = "tests/functional/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
# terminal input checks crossterm 0.29 lacks (runtime `tty_input`)
libc = "0.2"

[dev-dependencies]
libtest-mimic = "0.8.2"
# Oracle manifest `harness_sha256` (tests/visual_baseline/oracle.rs); the
# same version tuiscotti already pulls in.
sha2 = "0.11"
tuiscotti = { git = "https://github.com/tailrocks/tuiscotti", rev = "a1ea27f757d75d07b05499276cd932e9f8e067ad" }
tui-test = { package = "tuiscotti-tui-test", version = "=0.2.1" }
# Latest tuiscotti main (0.4.0, offline frozen-check layer). Renamed so the
# legacy live harness above keeps its 0.2 API until its deliberate migration.
tuiscotti-latest = { package = "tuiscotti", git = "https://github.com/tailrocks/tuiscotti", rev = "d8d54155947f6303a41dfd6079b53c0abc16f29a" }
serde_json = "1"

# Optimize dependencies in dev and test builds (tuiscotti's recommendation,
# docs/upstream/tuiscotti-feedback.md P6): the review PNG/HTML rendered for
# a visual mismatch drops from seconds to tens of milliseconds. Our own
# crates stay unoptimized for fast rebuilds. Numbers in
# docs/visual-testing/tuiscotti-migration.md ("Dev opt-level overrides").
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
