[workspace]
resolver = "3"

[package]
name = "termrock-visibility-publisher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
autobins = false

[dependencies]
base64 = "0.22.1"
crc32fast = "1.5.1"
flate2 = "1.1.10"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
rcgen = { version = "=0.14.8", default-features = false, features = ["ring"] }
