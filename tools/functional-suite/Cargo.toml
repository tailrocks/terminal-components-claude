[package]
name = "termrock-live-suite"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
autobins = false
autotests = false

[dependencies]
base64 = "=0.23.1"
serde = "=1.0.229"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tui-test-rs = { version = "=0.1.1", features = ["recording-raster", "recording-font-jetbrains-mono-styles"] }
tuiscotti = { version = "=0.3.0", git = "https://github.com/tailrocks/tuiscotti", rev = "ac5f70d14d1967f551261d599a4cd857ec9fa2d7" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[patch.crates-io]
tui-test-rs = { path = ".engine/tui-test/crates/tui-test" }

[workspace]
resolver = "3"
exclude = [".engine/tui-test"]

[[test]]
name = "functional"
path = "tests/functional.rs"
harness = true
