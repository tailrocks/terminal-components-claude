[version]
schema_version = 3
suite_id = "termrock-functional-suite-v3"
predecessor_suite_id = "termrock-functional-suite-v2"
result_inheritance = false
crosswalk = [
    "Retains all 84 v1 registered cases and 271 v1 coverage IDs; prior results are not inherited.",
    "The four delivery case IDs add changed first-use journeys; legacy first_* cases remain distinct.",
    "The first delivery subset contains four cases and 30 frame checkpoints; each exit result is separate.",
    "Holla checkpoint name empty_results was renamed to empty to match the updated Section 6 contract; prior captures remain historical and results are not inherited.",
    "holla.first_use.frame1 repeats the full seven-checkpoint first-use journey at --frame 1, outside the first subset.",
    "The 0.2.0 capture backend is a new suite successor: no v1, v2, or 0.1.1 result is inherited; reference A/B and explicit approval are required before the new expected store is populated.",
    "Existing showcase_status_and_hints gains a five-checkpoint native plan; this adds no case or coverage ID and is outside the first-delivery subset.",
    "Status & hints plan v2 corrects only the options_menu readiness oracle after independent review; v1 A/B failures remain immutable history and are not inherited.",
    "This revision registers 89 cases and 276 coverage IDs. Twelve cases currently have native action plans; the remaining 77 stay not-run or setup-failed until planned. These counts are descriptive and do not constrain future plan coverage.",
    "Existing tablepro_query_execution adds an ordered paused/full two-phase plan with 16 globally unique checkpoints; its nine coverage IDs and the 89-case/276-ID denominators stay unchanged.",
    "Runtime binary and output inputs are TERMROCK_PARITY_BIN_DIR and TERMROCK_PARITY_OUT_DIR."
]

[suite]
coverage_scope = "v3 retains all 84 v1 journeys and 271 v1 coverage IDs, adds four delivery cases and one Holla frame-1 variant, and adds plans to showcase_status_and_hints and tablepro_query_execution for 89 registered cases and 276 coverage IDs. Twelve cases currently have native action plans; the remaining 77 stay not-run or setup-failed until planned. These counts are descriptive, not a fixed coverage rule. The first four delivery cases contain 30 checkpoints; the Status & hints plan is outside that subset. Coverage IDs are requirement identifiers rather than frame counts. Results are not inherited across the v1, v2, or 0.2.0 capture contracts."
render_profile = "tuiscotti-pinned-v1"
fixture_dataset = "fixtures/dataset.json"
expected_store = "expected"
theme = "default"
no_color = "unset"
readiness_timeout_ms = 8000
readiness_poll_interval_ms = 100
settle_timeout_ms = 8000
settle_quiet_ms = 400

[suite.terminal]
cols = 120
rows = 40
locale = "C.UTF-8"
timezone = "UTC"
term = "xterm-256color"
color_term = "truecolor"
color_mode_arguments = ["--color", "truecolor"]
motion_arguments = ["--motion", "paused", "--frame", "0"]

[engine_pins]
tuiscotti-tui-test = "59a8ded6d8f419f93aaf2c0edcf8253a6e6c7496"
tuiscotti = "4b3a5e49ea2e5dbaa913534ced91aa9e45337d67"

