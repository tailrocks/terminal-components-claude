[package]
name = "refactor-proof"
description = "TASK-001 qualified-harness comparator and host core"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tc-proof"
path = "src/bin/tc_proof.rs"

[[bin]]
name = "tc-proof-host"
path = "src/bin/tc_proof_host.rs"

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tuisnap = { package = "tuiscotti", git = "https://github.com/tailrocks/tuiscotti", rev = "a1ea27f757d75d07b05499276cd932e9f8e067ad", default-features = false }

[dev-dependencies]
libc = "0.2"
tempfile = "3"

[lints]
workspace = true

# Rust documentation examples are guarded by the workspace doc inventory test.
[lib]
doctest = false
