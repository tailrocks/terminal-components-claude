[package]
name = "refactor-proof"
description = "TASK-001 qualified-harness comparator and host core"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
autobenches = false

[[bin]]
name = "tc-proof"
path = "src/bin/tc_proof.rs"
test = false
bench = false

[[bin]]
name = "tc-proof-host"
path = "src/bin/tc_proof_host.rs"
test = false
bench = false

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tuisnap = { package = "tuiscotti", git = "https://github.com/tailrocks/tuiscotti", rev = "a1ea27f757d75d07b05499276cd932e9f8e067ad", default-features = false }
[lints]
workspace = true

[lib]
doctest = false
test = false
bench = false
