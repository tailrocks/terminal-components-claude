      - name: Run suite (visual-narrow)
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          NEXTEST_TEST_THREADS: "4"
          VELNOR_SUITE_FILTERSET: ${{ inputs.filter }}
          VELNOR_SUITE_SHARD: ${{ matrix.shard }}
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; if [ -n \"${VELNOR_SUITE_FILTERSET:-}\" ]; then mise --no-config --no-env --no-hooks exec rust@1.99.1 aqua:nextest-rs/nextest/cargo-nextest@0.9.148 -- cargo nextest run --archive-file \"$RUNNER_TEMP/velnor/suite-archive-visual-narrow/archive.tar.zst\" --workspace-remap . --extract-to . --extract-overwrite --no-tests warn --partition \"hash:$VELNOR_SUITE_SHARD/2\" --profile narrow --run-ignored only -E \"$VELNOR_SUITE_FILTERSET\"; else mise --no-config --no-env --no-hooks exec rust@1.99.1 aqua:nextest-rs/nextest/cargo-nextest@0.9.148 -- cargo nextest run --archive-file \"$RUNNER_TEMP/velnor/suite-archive-visual-narrow/archive.tar.zst\" --workspace-remap . --extract-to . --extract-overwrite --no-tests warn --partition \"hash:$VELNOR_SUITE_SHARD/2\" --profile narrow --run-ignored only; fi'"
      - name: Upload suite artifact (visual-narrow-{shard})
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: warn
          name: velnor-suite-r${{ github.run_id }}-a${{ github.run_attempt }}-visual-narrow-${{ matrix.shard }}
          path: "target/tuiscotti/actual\ntarget/tuiscotti/expected\ntarget/tuiscotti/diff"
          retention-days: "14"
