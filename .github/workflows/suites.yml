          mise-sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          seed-admitted: ${{ steps.v2.outputs.seed_admitted }}
      - name: Download suite archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: velnor-suite-archive-r${{ github.run_id }}-a${{ env.VELNOR_RUN_KEY_ATTEMPT }}-visual-smoke
          path: ${{ runner.temp }}/velnor/suite-archive-visual-smoke
      - name: Install suite tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: "env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_RUNTIME_TOKEN -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN -u GH_TOKEN -u GH_HOST -u GH_CONFIG_DIR mise --no-config --no-env --no-hooks install 'rust@'\"${VELNOR_TOOL_RUST}\" 'aqua:nextest-rs/nextest/cargo-nextest@'\"${VELNOR_TOOL_NEXTEST}\""
      - name: Run suite (visual-smoke)
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          NEXTEST_TEST_THREADS: "4"
          VELNOR_SUITE_FILTERSET: ${{ inputs.filter }}
          VELNOR_SUITE_SHARD: ${{ matrix.shard }}
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; if [ -n \"${VELNOR_SUITE_FILTERSET:-}\" ]; then mise --no-config --no-env --no-hooks exec rust@'\"${VELNOR_TOOL_RUST}\"' aqua:nextest-rs/nextest/cargo-nextest@'\"${VELNOR_TOOL_NEXTEST}\"' -- cargo nextest run --archive-file \"$RUNNER_TEMP/velnor/suite-archive-visual-smoke/archive.tar.zst\" --workspace-remap . --extract-to . --extract-overwrite --no-tests warn --partition \"hash:$VELNOR_SUITE_SHARD/2\" --profile smoke --run-ignored only -E \"$VELNOR_SUITE_FILTERSET\"; else mise --no-config --no-env --no-hooks exec rust@'\"${VELNOR_TOOL_RUST}\"' aqua:nextest-rs/nextest/cargo-nextest@'\"${VELNOR_TOOL_NEXTEST}\"' -- cargo nextest run --archive-file \"$RUNNER_TEMP/velnor/suite-archive-visual-smoke/archive.tar.zst\" --workspace-remap . --extract-to . --extract-overwrite --no-tests warn --partition \"hash:$VELNOR_SUITE_SHARD/2\" --profile smoke --run-ignored only; fi'"
      - name: Upload suite artifact (visual-smoke-{shard})
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: warn
