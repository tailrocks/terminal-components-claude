  jactionlint:
    name: Jactionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env: &m21
      VELNOR_RUN_KEY_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Record optional cache budget
        id: velnor-cache-clock
        run: *r1
        env:
