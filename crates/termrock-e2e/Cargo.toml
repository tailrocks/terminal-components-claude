[package]
name = "termrock-e2e"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
autotests = false
autobenches = false

[workspace]
resolver = "3"

[[bin]]
name = "admit_expected_generation"
path = "src/bin/admit_expected_generation.rs"
test = false
bench = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tuiscotti = { git = "https://github.com/tailrocks/tuiscotti", rev = "a1ea27f757d75d07b05499276cd932e9f8e067ad", features = ["pty"] }

[build-dependencies]
sha2 = "0.11"

[lib]
test = false
bench = false
doctest = false
