[package]
name = "termrock-e2e"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]
resolver = "3"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tuiscotti = { git = "https://github.com/tailrocks/tuiscotti", rev = "a47c9aaefb34e4c00026f99d8a8dd7ee5916b274", features = ["pty"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
jsonschema = { version = "=0.58.6", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }
termpane = { version = "=0.1.0", features = ["pty"] }
