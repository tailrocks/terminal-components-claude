[package]
name = "termrock-visibility-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
autotests = false
autobenches = false

[workspace]
resolver = "3"

[dependencies]
flate2 = "=1.1.10"
libc = "=0.2.191"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tar = { version = "=0.4.46", default-features = false }

[lib]
test = false
bench = false
doctest = false
[[bin]]
name = "capture-command"
path = "src/bin/capture-command.rs"
test = false
bench = false
[[bin]]
name = "nextest-result-reader"
path = "src/bin/nextest-result-reader.rs"
test = false
bench = false
