[package]
name = "termrock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
testing = ["termrock-runtime/testing", "termrock-viewport/testing"]

[dependencies]
termrock-core.workspace = true
termrock-layout.workspace = true
termrock-theme.workspace = true
termrock-text.workspace = true
termrock-render.workspace = true
termrock-collections.workspace = true
termrock-runtime.workspace = true
termrock-controls.workspace = true
termrock-fields.workspace = true
termrock-feedback.workspace = true
termrock-navigation.workspace = true
termrock-viewport.workspace = true
termrock-overlays.workspace = true
termrock-grid.workspace = true
termrock-editors.workspace = true
termrock-forms.workspace = true
termrock-terminal.workspace = true
termrock-session.workspace = true
termrock-shell.workspace = true
ratatui.workspace = true
ratatui-core.workspace = true

# The example journeys drive the runtime through the testing harness surface
# (Runtime::draw_buffer and friends); they need the facade's testing feature.
[[test]]
name = "ex01_button"
required-features = ["testing"]

[[test]]
name = "ex02_text_input"
required-features = ["testing"]

[[test]]
name = "slots"
required-features = ["testing"]

[[test]]
name = "split_block_consumer"
required-features = ["testing"]

[[test]]
name = "master_detail_consumer"
required-features = ["testing"]

[[test]]
name = "nav_list_composition_consumer"
required-features = ["testing"]

[[test]]
name = "select_composition_consumer"
required-features = ["testing"]

[[test]]
name = "manager_composition_consumer"
required-features = ["testing"]

[[test]]
name = "tree_composition_consumer"
required-features = ["testing"]

# Rust documentation examples are guarded by the workspace doc inventory test.
[lib]
doctest = false
