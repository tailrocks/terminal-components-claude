[package]
name = "termrock-visibility-publisher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
autobenches = false

[dependencies]
base64 = "0.23.1"
crc32fast = "1.5.1"
flate2 = "1.1.10"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
[lib]
doctest = false
test = false
bench = false
[[bin]]
name = "observer-ingest"
path = "src/bin/observer-ingest.rs"
test = false
bench = false
[[bin]]
name = "status-publish"
path = "src/bin/status-publish.rs"
test = false
bench = false
