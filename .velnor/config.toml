schema = 1

[workflow]
policy = "consumer-v1"
default_branch = "main"
runner_label = "ubuntu-24.04"

[stacks.rust]
compile_driver = "cargo"
test_runner = "cargo_nextest"
# Ignored tests stay ignored in CI: the PARITY known-diff and frozen-fixture
# suites are run explicitly against their references (ledger §7 V-07/V-18);
# several are platform-dependent and would fail per-runner.
run_ignored = "default"

[discovery]
exclude = ["xtask/fixtures/**", "tools/termrock-visibility-publisher/**", "crates/termrock-e2e/**", "crates/termrock-visibility-tests/**", "crates/showcase-data/**", "crates/holla-catalog/**", "crates/holla-plan/**"]
