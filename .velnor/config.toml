# Velnor Actions input for this repository. Everything under
# .github/workflows/ (plus .github/actions/, .github/scripts/,
# .github/actionlint.yaml, .github/AGENTS.md) is generated from this file by
# `velnor-actions generate`; never hand-edit those outputs. See docs/ci.md.
schema = 1

[workflow]
policy = "consumer-v1"
# The working branch; pushes here run CI, pull requests run CI regardless.
default_branch = "design/interaction-polish"
# docs/visual-testing/plan.md §C3: CI runs on ubuntu-24.04.
runner_label = "ubuntu-24.04"

[stacks.rust]
# Plain Cargo; matches the documented gate in AGENTS.md.
compile_driver = "cargo"
# Nextest only (AGENTS.md: never `cargo test`). Velnor selects the `ci`
# profile from .config/nextest.toml. Doctests are disabled in Cargo.toml
# (`[lib] doctest = false`) so no `cargo test --doc` step is generated;
# formatting is a native step because rustfmt.toml exists.
test_runner = "cargo_nextest"
# Ignored tests stay ignored: the PTY visual captures are ignored and run
# explicitly (docs/visual-testing).
# The visual tiers are separate suites (below), not part of this job.
run_ignored = "default"

[discovery]
# Archived evidence workspaces under docs/ are records, not CI units.
exclude = ["docs/**", "tools/frozen-cli-frame-support/**"]

[agents]
# .github/CLAUDE.md is a symlink to .github/AGENTS.md (AGENTS.md rule).
claude_md = "symlink"

# Visual tiers (docs/visual-testing/plan.md §C1) as nextest suites in
# .github/workflows/suites.yml. Every tier is manual (workflow_dispatch)
# until oracle v0 (plan T18); docs/ci.md "Visual suites" has the post-T18
# triggers.
[workflow.dispatch.inputs.tier]
type = "choice"
description = "Visual tier (docs/visual-testing/plan.md C1)"
default = "smoke"
options = ["smoke", "full", "narrow", "capture"]

[workflow.dispatch.inputs.filter]
type = "string"
description = "Optional nextest filterset, for example test(/^holla::/)"

[[stacks.rust.suites]]
id = "visual-smoke"
profile = "smoke"
run_ignored = "only"
partitions = 2
build = "archive"
timeout_minutes = 30
test_threads = 4
triggers = ["workflow_dispatch"]
dispatch_inputs = { tier = ["smoke"] }
filter_input = "filter"
artifacts = [{ name = "visual-smoke-{shard}", paths = ["target/tuiscotti/actual", "target/tuiscotti/expected", "target/tuiscotti/diff"], when = "failure", retention_days = 14 }]

[[stacks.rust.suites]]
id = "visual-full"
profile = "full"
run_ignored = "only"
partitions = 12
build = "archive"
timeout_minutes = 60
test_threads = 4
triggers = ["workflow_dispatch"]
dispatch_inputs = { tier = ["full"] }
filter_input = "filter"
artifacts = [{ name = "visual-full-{shard}", paths = ["target/tuiscotti/actual", "target/tuiscotti/expected", "target/tuiscotti/diff"], when = "failure", retention_days = 14 }]

[[stacks.rust.suites]]
id = "visual-narrow"
profile = "narrow"
run_ignored = "only"
partitions = 2
build = "archive"
timeout_minutes = 60
test_threads = 4
triggers = ["workflow_dispatch"]
dispatch_inputs = { tier = ["narrow"] }
filter_input = "filter"
artifacts = [{ name = "visual-narrow-{shard}", paths = ["target/tuiscotti/actual", "target/tuiscotti/expected", "target/tuiscotti/diff"], when = "failure", retention_days = 14 }]

[[stacks.rust.suites]]
id = "visual-capture"
profile = "capture"
run_ignored = "only"
partitions = 12
build = "archive"
timeout_minutes = 60
test_threads = 4
triggers = ["workflow_dispatch"]
allow_failure = true
env = { VISUAL_FULL = "1" }
dispatch_inputs = { tier = ["capture"] }
filter_input = "filter"
artifacts = [{ name = "visual-capture-{shard}", paths = ["target/tuiscotti/actual"], when = "always", retention_days = 14 }]
